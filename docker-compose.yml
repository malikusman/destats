services:
  mock-api:
    profiles: ["demo"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: node mock-api/server.mjs
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8088:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    environment:
      # Upstream NetApp ingestion API. The container (i.e. the Docker host)
      # must be able to route to this address — VPN / Tailscale / WireGuard.
      - API_TARGET=${API_TARGET:-http://10.0.65.40:8080}
      # Platform APIs (incidents, use cases, knowledge, learning, evaluation).
      # Default: TDK platform gateway (VPN required).
      # Override for direct incident service (deferred): http://10.0.65.19:8003
      # Local mock only: docker compose --profile demo up, INCIDENT_API_TARGET=http://mock-api:3090
      - INCIDENT_API_TARGET=${INCIDENT_API_TARGET:-http://10.0.65.19:8088/incident-api}
      # Control Plane (Epics 7/13/14). Correct host is .40 — .19:8000 is Attu.
      - CONTROL_PLANE_API_TARGET=${CONTROL_PLANE_API_TARGET:-http://10.0.65.40:8000}
    restart: unless-stopped
